name: Publish oli-skills to npm

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.cursor/skills/**'
      - '.superpowers/skills/**'
      - '.marketing/skills/**'
      - '.vercel-skills/skills/**'
      - '.claude-seo/skills/**'
      - '.agency/skills/**'
      - 'packages/oli-skills/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build package
        working-directory: packages/oli-skills
        run: node scripts/build.js

      - name: Get current version
        id: current_version
        working-directory: packages/oli-skills
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Bump patch version
        working-directory: packages/oli-skills
        run: npm version patch --no-git-tag-version

      - name: Get new version
        id: new_version
        working-directory: packages/oli-skills
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Publish to npm
        working-directory: packages/oli-skills
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/oli-skills/package.json
          git commit -m "chore: bump oli-skills to v${{ steps.new_version.outputs.version }}" || exit 0
          git push

      - name: Summary
        run: |
          echo "## 📦 oli-skills published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.new_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npx oli-skills@${{ steps.new_version.outputs.version }} init" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
